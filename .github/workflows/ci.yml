name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backend:
    name: Backend tests (faiss + numpy backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizers-${{ hashFiles('docagent/settings.py') }}
      - run: pip install -r requirements-cpu.txt -e .
      - run: python -m pytest -q
      - name: Evaluation pipeline smoke (fake provider, 5 questions)
        run: python -m docagent.eval --provider fake --limit 5 --data-dir /tmp/eval --out /tmp/results.json --report /tmp/EVAL.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-smoke
          path: /tmp/results.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  compose-smoke:
    name: Docker Compose end-to-end (fake provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - name: Build, start, upload a document, query it
        env:
          DOCAGENT_PROVIDER: fake
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color | tail -200; docker compose down --volumes' EXIT
          docker compose up --build --detach --wait --wait-timeout 600
          python scripts/wait_and_smoke.py http://localhost:8000
          curl -fsS http://localhost:8080/ | grep -q "DocAgent"

  kind-smoke:
    name: Kubernetes (kind) rollout + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - uses: helm/kind-action@v1
        with:
          cluster_name: docagent
          wait: 120s
      - name: Build image, load into kind, apply manifests, wait for rollout, smoke
        run: bash scripts/kind-up.sh
      - name: Show what ran
        if: always()
        run: kubectl -n docagent get all

  terraform:
    name: Terraform validate (AWS ECS Fargate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive

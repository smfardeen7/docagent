[project]
name = "docagent"
version = "0.1.0"
requires-python = ">=3.12"
description = "Agentic RAG assistant over your own documents"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docagent*"]

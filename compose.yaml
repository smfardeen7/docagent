services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DOCAGENT_REDIS_URL: redis://redis:6379
      DOCAGENT_PROVIDER: ${DOCAGENT_PROVIDER:-hf}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - data:/data
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["arq", "docagent.worker.main.WorkerSettings"]
    environment:
      DOCAGENT_REDIS_URL: redis://redis:6379
      DOCAGENT_PROVIDER: ${DOCAGENT_PROVIDER:-hf}
    volumes:
      - data:/data
      - models:/models
    # The image's default HEALTHCHECK probes the API port; the worker has none, so check arq's heartbeat in
    # Redis instead (a redis-only script: `arq --check` imports torch and can exceed the timeout on small runners).
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  data: {}
  models: {}
